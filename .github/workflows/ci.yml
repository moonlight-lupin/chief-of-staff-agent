name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prepare temp dir
        run: mkdir -p "$TMPDIR"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Lint (ruff)
        run: |
          python -m pip install ruff
          ruff check shared/ skills/ hooks.py __init__.py
      - name: Dependency sanity check
        run: |
          python -c "
          import importlib, sys
          missing = []
          for mod in ('yaml', 'docx', 'fitz', 'requests', 'google.auth', 'cryptography', 'msal'):
              try:
                  importlib.import_module(mod)
              except BaseException as exc:
                  missing.append(f'{mod}: {type(exc).__name__}: {exc}')
          if missing:
              print('Declared dependencies are not importable:')
              for m in missing:
                  print('  ' + m)
              sys.exit(1)
          print('All declared dependencies import cleanly.')
          "
      - name: Run tests
        run: python -m pytest --junitxml=pytest-results.xml -q
      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: pytest-results.xml
          if-no-files-found: error