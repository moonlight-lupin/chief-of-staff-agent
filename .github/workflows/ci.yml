name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token for every job; a job that needs more must say so itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      # Actions are pinned to full commit SHAs (tests/test_supply_chain.py);
      # Dependabot proposes updates.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prepare temp dir
        run: mkdir -p "$TMPDIR"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Lint (ruff)
        run: |
          # Pinned: an unpinned ruff picks up new rules on release day and turns
          # a green branch red without a code change. The rule set itself is
          # declared in pyproject.toml [tool.ruff.lint].
          python -m pip install 'ruff==0.16.3'
          ruff check shared/ skills/ hooks.py __init__.py
      - name: Dependency sanity check
        run: |
          # Reuses the same check `chief_of_staff.py doctor` runs, so CI and the
          # operator-facing health check can never disagree about what a working
          # install means.
          python -c "
          import sys
          sys.path.insert(0, 'shared/scripts')
          from pathlib import Path
          from doctor_base import _check_packages
          result = _check_packages(False, None, Path('.'))
          print(f'{result.status}: {result.detail}')
          sys.exit(0 if result.status == 'pass' else 1)
          "
      - name: Run tests
        run: python -m pytest --junitxml=pytest-results.xml -q
      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: pytest-results.xml
          if-no-files-found: error

  security:
    # Known-vulnerability audit of the declared dependencies, plus the
    # repository hygiene tests (pinned actions, no tracked secrets or user data).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Audit dependencies (pip-audit)
        run: |
          python -m pip install 'pip-audit==2.10.1'
          # What installs today (newest allowed, full tree)...
          pip-audit -r requirements.txt --progress-spinner off
          # ...and the oldest versions the floors still allow: an existing
          # environment that already meets the floors is never upgraded.
          sed -nE 's/^([A-Za-z0-9_.-]+)>=([^,]+),.*/\1==\2/p' requirements.txt > "$RUNNER_TEMP/floors.txt"
          cat "$RUNNER_TEMP/floors.txt"
          pip-audit -r "$RUNNER_TEMP/floors.txt" --no-deps --disable-pip --progress-spinner off
          # The floors must also be installable together.
          python -m pip install --dry-run --ignore-installed -q -r "$RUNNER_TEMP/floors.txt"
      - name: Repository hygiene
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q tests/test_supply_chain.py
