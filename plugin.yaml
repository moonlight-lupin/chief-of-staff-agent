name: chief-of-staff
version: 0.2.6
author: moonlight-lupin
license: MIT
description: "AI Chief of Staff for SMEs — briefings, deadlines, pipeline, docs, calendar, knowledge base, research, travel, bookkeeping, self-signing, and backups."
requires_skills: []
optional_skills:
  - google-workspace

# Skill profiles — determines which skills are registered.
# Default profile registers all 17 skills including self-sign and email-organisation.
# Enterprise profile swaps self-sign for esign-connector (DocuSeal).
skill_profiles:
  default:
    registered:
      - daily-briefing
      - deadline-tracker
      - note-taker
      - todo-list
      - calendar-manager
      - drive-filer
      - meeting-prep
      - weekly-review
      - document-preparer
      - pipeline-manager
      - bookkeeper
      - deep-research
      - entity-research
      - travel-itinerary
      - backup
      - email-organisation
      - self-sign
  enterprise:
    registered:
      - daily-briefing
      - deadline-tracker
      - note-taker
      - todo-list
      - calendar-manager
      - drive-filer
      - meeting-prep
      - weekly-review
      - document-preparer
      - pipeline-manager
      - bookkeeper
      - deep-research
      - entity-research
      - travel-itinerary
      - backup
      - email-organisation
      - esign-connector
    optional:
      - self-sign