[project]
name = "chief-of-staff-plugin"
version = "0.5.4"
description = "Hermes Chief-of-Staff plugin foundation layer"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "python-docx>=1.1",
  "pymupdf>=1.24",
  "requests>=2.31",
  "google-auth>=2.38",
  "cryptography>=38.0",
  "msal>=1.28",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Declared explicitly rather than inherited. Ruff's *default* select changed in
# 0.16 from the classic pycodestyle/pyflakes set to a much broader one, which
# turned a clean local run into 859 CI findings overnight. Pinning the version
# in CI is not enough on its own — the selected rules have to be a decision the
# project makes, not a default it happens to receive.
select = ["E4", "E7", "E9", "F"]

# E402 is structural here: every script bootstraps sys.path so that
# shared/scripts/ is importable before it imports from it. Moving those imports
# to the top of the file would break the plugin's flat-script layout.
ignore = ["E402"]